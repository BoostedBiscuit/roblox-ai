// =====================================================================================
// SETUP: renderer, camera, light, the cast, the Echoes, effects and the helpers every chapter file uses (window.EB)
// =====================================================================================
(function () {
  'use strict';
  const { clamp, lerp, ease, easeOut, easeOutBack } = RT, A = RT.anim, C = RT.cast, EC = RT.echoes;
  const RENDER = RT.player.RENDER || !!RT.player.THUMB;
  const NAR = window.RT_NARRATION['echo-breakers-full'];
  const LN = (lb) => { const l = NAR.lines.find((x) => x.label === lb); if (!l) throw new Error('no NARRATION line labelled ' + lb); return l; };
  const S = (lb, d = 0) => +(LN(lb).start + d).toFixed(3), E = (lb, d = 0) => +(LN(lb).end + d).toFixed(3);
  const WD = (lb, word) => { const l = LN(lb), w = l.words.find((k) => k.w.toLowerCase().replace(/[^a-z']/g, '') === word); return w ? w.start : l.start; };   // when a word is said
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  // ---------- renderer, camera, light ----------
  const renderer = RT.mood.renderer(null, { preserve: RENDER });
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 9 / 16, 0.1, 5000);
  const env = RT.mood.create(scene, renderer, { mood: 'halcyon', shadowSize: 2048 });
  const key = new THREE.DirectionalLight('#fff4e6', 0); scene.add(key, key.target);      // soft face light for close-ups (no shadows)
  let glow = null;                                                                       // bloom pass (made at the first frame, at the final size)

  // ---------- locations (built the first time they are used; only one is visible) ----------
  const LIGHT = { stairway: 0.5, recordShop: 0.9, piazza: 0.5, promenade: 0.5, fortress: 0.62, arena: 1, darkRoom: 1 };   // Echo brightness per place (see echoes.js "light")
  const LOCS = {}, SNAP = new Map();
  function loc(name) {
    if (LOCS[name]) return LOCS[name];
    const g = RT.locations[name](); g.visible = false; scene.add(g); LOCS[name] = g;
    // remember every prop's start state: each frame starts from it, so a shot can move props without affecting other shots
    const objs = new Set([...(g.breakables || [])]); const add = (v) => { if (v && v.isObject3D) objs.add(v); else if (Array.isArray(v)) v.forEach(add); };
    Object.values(g.props || {}).forEach(add);
    SNAP.set(g, [...objs].map((o) => ({ o, p: o.position.clone(), q: o.quaternion.clone(), s: o.scale.clone(), v: o.visible })));
    return g;
  }
  let cur = null, curMood = '';
  function useLoc(name, mood) {
    const g = loc(name);
    if (cur !== g) { if (cur) cur.visible = false; g.visible = true; cur = g; }
    for (const r of SNAP.get(g)) { r.o.position.copy(r.p); r.o.quaternion.copy(r.q); r.o.scale.copy(r.s); r.o.visible = r.v; }
    const m = mood || g.mood, mk = typeof m === 'string' ? m : JSON.stringify(m);
    if (mk !== curMood) { env.set(m); curMood = mk; }
    EB.light = LIGHT[name] ?? 1;
    return g;
  }
  // a location's props live in its own (design) units: world = design × SCALE
  const D = (v) => v / RT.locations.SCALE;

  // ---------- the cast ----------
  const dante = C.dante(), aurora = C.aurora(), grant = C.grant(), hale = C.hale(), vahl = C.vahl();
  const hunters = [1, 2, 3, 4, 5].map((i) => C.hunter(i));
  const walkers = [3, 7, 12, 18, 25, 31].map((s) => C.walker(s));
  const copies = Array.from({ length: 10 }, () => RT.fx.mirageCopy(() => C.dante()));      // KAGEROU's fake Dantes
  const auroraCopies = [0, 1].map(() => RT.fx.mirageCopy(() => C.aurora()));
  const hibiki = EC.hibiki(), kagerou = EC.kagerou(), omamori = EC.omamori(), tsurara = EC.tsurara(), shuen = EC.shuen();
  const PEOPLE = [dante, aurora, grant, hale, vahl, ...hunters, ...walkers, ...copies, ...auroraCopies];
  const ECHOES = [hibiki, kagerou, omamori, tsurara, shuen];

  player.add(RT.mesh(RT.roundedBoxGeometry(1.15, 0.32, 0.95, 0.06, 2), RT.plastic('#2f3a4a', { roughness: 0.4 })).translateY(0.16));

  const thrownPhones = dante.rig.props.headphones.clone(); thrownPhones.visible = false; scene.add(thrownPhones);
  const flyingHat = grant.rig.props.hat.clone(); flyingHat.visible = false; scene.add(flyingHat);
  const gull = RT.kit.seagull(1.3); gull.visible = false; scene.add(gull);
  const iceLegs = new THREE.Group(); const iceM = new THREE.MeshStandardMaterial({ color: '#bff3ff', roughness: 0.05, transparent: true, opacity: 0.78, emissive: '#3fc8ff', emissiveIntensity: 0.2 });
  iceLegs.add(RT.mesh(new THREE.DodecahedronGeometry(0.75, 0), iceM)); iceLegs.children[0].scale.set(1.2, 1.1, 1.0); iceLegs.children[0].position.y = 0.55; scene.add(iceLegs); iceLegs.visible = false;

  const fx3 = {
    barrage: RT.fx.barrage('#4fb8ff'), barrage2: RT.fx.barrage('#a070ff'), barrageIce: RT.fx.barrage('#7fe6ff', 14),
    wave: RT.fx.shockwave('#ffffff'), wave2: RT.fx.shockwave('#9fd8ff'), wave3: RT.fx.shockwave('#c79bff'), ground: RT.fx.shockwave('#ffe6a0'),
    debris: RT.fx.debris(36, ['#7a1f2b', '#ffd98a', '#2a2b2e']), rubble: RT.fx.debris(44, ['#c9b79a', '#8f7f68']), fruit: RT.fx.debris(30, ['#ff9a1f', '#f5e04a', '#d83a2e', '#7cc04a'], 0.22),
    goldBits: RT.fx.debris(40, ['#ffd45a', '#fff2b0'], 0.3, true), phoneBits: RT.fx.debris(14, ['#eef3ff', '#3a8dff', '#222'], 0.12),
    sparks: RT.fx.debris(26, ['#ffffff', '#9fd8ff'], 0.08, true), hazeBits: RT.fx.debris(30, ['#ffb35a', '#fff0d6'], 0.15, true), luck: RT.fx.debris(18, ['#ffd84a', '#fff6c8'], 0.1, true),
    cracks: RT.fx.cracks(3), cracks2: RT.fx.cracks(8), notes: RT.fx.notes('#c08bff'), goldNotes: RT.fx.notes('#ffd45a', 10), strings: RT.fx.strings('#c46bff'),
    spikes: RT.fx.iceSpikes(16, 5), spikes2: RT.fx.iceSpikes(10, 9), shards: RT.fx.shards(80), shardsSmall: RT.fx.shards(30),
    walls: [0, 1, 2, 3].map(() => RT.fx.ghostWall('#ffb35a', 5, 3.2)),
    dust: RT.fx.dust('#d9c8a8'), dust2: RT.fx.dust('#d9c8a8'), iceDust: RT.fx.dust('#eefbff'), sandDust: RT.fx.dust('#cdb48a', 12),

  // HELPERS used by the chapter files

  const put = (o, p, yaw = 0) => { o.visible = true; o.position.set(p[0], p[1], p[2]); o.rotation.set(0, yaw, 0); return o; };

  const pose = (ch, move, lt, o = {}) => { const P = Object.assign(A.pose(move, Math.max(0, lt), o), o.mod || {}); A.apply(ch, P); if (o.face) ch.rig.setFace(o.face); return P; };

  function walk(ch, pts, t0, speed, t, o = {}) {
    const segs = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], d = Math.hypot(b[0] - a[0], b[2] - a[2]); segs.push({ a, b, d, from: total }); total += d; }

    ec.visible = true; ec.position.set(p[0], p[1] + (o.float ?? 0.35) + Math.sin(t * 2.2) * 0.07, p[2]); ec.rotation.set(0, yaw, 0);

  const hitStop = (t, hits, hold = 0.1) => { let d = 0; for (const h of hits) if (t > h) d += Math.min(t - h, hold); return t - d; };
  const popIn = (t, t0, dur = 0.35) => (t < t0 ? 0 : easeOutBack(clamp((t - t0) / dur, 0, 1), 2.2));

  const SHOTS = [];

    THREE, RT, A, scene, camera, renderer, env, key, NAR, LN, S, E, WD, V, D, F, fx3, LIGHT, light: 1,
    dante, aurora, grant, hale, vahl, hunters, walkers, copies, auroraCopies, hibiki, kagerou, omamori, tsurara, shuen, PEOPLE, ECHOES,
    handRecord, player, spinDisc, thrownPhones, flyingHat, gull, iceLegs,
    loc, useLoc, put, pose, walk, beside, echoAt, popIn, ramp, head, lookYaw, hitStop,
    shot(s) { SHOTS.push(s); return s; }, SHOTS, extra: [],                             // extra: props a chapter adds (hidden every frame unless a shot shows them) get glow() { return glow; }, set glow(g) { glow = g; }, RENDER,
  };
})();

<script>
// =====================================================================================
// RUN: every frame is a pure function of t (the renderer asks for frame f at t = f / 30)
// =====================================================================================
(function () {
  'use strict';
  const { scene, camera, renderer, env, key, F, fx3, A } = EB, { clamp, lerp } = RT;
  const shots = RT.camera.list(EB.SHOTS);
  shots.shots.forEach((s, i) => { s.t1 = shots.shots[i + 1] ? shots.shots[i + 1].t0 : EB.DURATION; });
  const FX3 = Object.values(fx3).flat(), TALKERS = { dante: EB.dante, aurora: EB.aurora, grant: EB.grant, hale: EB.hale, vahl: EB.vahl };
  // lips: a character's mouth flaps on the words of their own lines (Echoes, thoughts and the narrator never move a mouth)
  function lips(t) {
    for (const who in TALKERS) {
      const ch = TALKERS[who], l = EB.NAR.lines.find((x) => x.who === who && t >= x.start - 0.02 && t < x.end);
      let open = false; if (l) { const w = l.words.find((k) => t >= k.start && t < k.end); open = !!w && Math.sin((t - w.start) * 25) > -0.35; }
      if (l || !ch.userData.mouthHeld) ch.rig.setMouth(open);

  // ---------- one shot's state at time t (location, actors, effects) ----------
  function setup(s, t) {
    for (const o of EB.PEOPLE) o.visible = false;
    for (const o of EB.ECHOES) o.visible = false;
    for (const o of FX3) o.visible = false;
    for (const o of [EB.player, EB.thrownPhones, EB.flyingHat, EB.gull, EB.iceLegs, EB.handRecord, ...EB.extra]) o.visible = false;
    EB.dante.rig.props.headphones.visible = true; EB.grant.rig.props.hat.visible = true;      // (shots may hide them)
    EB.shuen.rig.head.visible = true; EB.shuen.echo.crackMask(0); EB.vahl.rig.crackMask(0);
    for (const ch of [EB.aurora, EB.grant, EB.hale]) ch.rig.setEyes(null);
    for (const ec of EB.ECHOES) { ec.rotation.order = 'XYZ'; ec.rotation.x = 0; }
    const g = EB.useLoc(s.loc, s.mood);
    key.intensity = 0;
    if (s.run) s.run(t, t - s.t0, s);
    if (g.update) g.update(s.locT ? s.locT(t) : t, typeof s.locOpts === 'function' ? s.locOpts(t) : s.locOpts || {});
    for (const ch of EB.PEOPLE) if (ch.visible) ch.rig.update(t);
    lips(t);
  }
  // ---------- SMOOTH TRANSITIONS ----------
  // No hard cuts. When a new shot starts in the same place, the camera glides from where the last shot's camera was
  // to the new one (s.blend seconds, default 0.55; it swings around the subject instead of flying through it). When the
  // new shot is in another place — or the two cameras face each other (a glide would whip through the subject) — the old
  // picture dissolves into the new one (s.xfade seconds, default 0.5). dissolve: true asks for a dissolve anyway.
  // cut: true keeps a hard cut (only the quick flash inserts of the thinking moments).
  // kicks: [times] jolts the camera on big hits (kickAmp = how hard).

  const tmpCam = new THREE.PerspectiveCamera(50, 9 / 16, 0.1, 5000);
  const prevOf = (s) => (s.k > 0 ? shots.shots[s.k - 1] : null);
  function transOf(s) {                                                                    // 'cut' | 'glide' | 'fade' (decided once, at s.t0)
    if (s.trans) return s.trans;
    const prev = prevOf(s);
    if (!prev || s.cut) return (s.trans = 'cut');
    if (prev.loc !== s.loc || s.dissolve) return (s.trans = 'fade');
    setup(s, s.t0); tmpCam.aspect = camera.aspect;
    const a = RT.camera.apply(tmpCam, prev, s.t0), b = RT.camera.apply(tmpCam, s, s.t0);
    const oa = a.pos.clone().sub(a.look).normalize(), ob = b.pos.clone().sub(b.look).normalize();
    const far = a.look.distanceTo(b.look) > 3 * Math.max(1, Math.min(a.pos.distanceTo(a.look), b.pos.distanceTo(b.look)));
    return (s.trans = oa.dot(ob) < -0.25 || far ? 'fade' : 'glide');
  }
  function placeCamera(s, t) {
    tmpCam.aspect = camera.aspect;
    const r = RT.camera.apply(camera, s, t), prev = prevOf(s), BL = Math.min(s.blend ?? 0.55, s.dur * 0.6);

  const draw = () => drawShot(shots.at(EB.tNow || 0));

    name: 'echo-breakers-full', duration: EB.DURATION, renderer, scene, camera,
    frame: (t) => { EB.tNow = t; frame(t); }, draw, narration: EB.NAR,
    speakers: { dante: 'DANTE', aurora: 'AURORA', grant: 'GRANT', hale: 'HALE', vahl: 'MAESTRO VAHL' },
    echoes: { hibiki: { name: 'HIBIKI', color: '#3f9bff' }, kagerou: { name: 'KAGEROU', color: '#ff8a2a' }, omamori: { name: 'OMAMORI', color: '#ffc81f', ink: '#3a2200' }, tsurara: { name: 'TSURARA', color: '#3fd0ff', ink: '#002a3a' }, shuen: { name: 'SHŪEN', color: '#8a4dff' } },
    thinkers: { think: { color: '#5fb8ff' }, vahlthink: { color: '#b46bff' } },
    noCaptions: EB.noCaptions || [], overlayLayers: F.layers, overlays: (t) => F.update(t),
    black: EB.black, white: EB.white, stills: EB.STILLS || [], thumbnail: (n) => EB.thumbnail(n),
    menu: { title: 'ECHO BREAKERS', sub: 'The whole story · tap to play' },
    audio: '../audio/mix/echo-breakers-full_mix.mp3',
  });
  if (RT.player.THUMB && EB.thumbnail) { /* thumbnail mode is handled by the player calling o.thumbnail */ }
})();
</script>
