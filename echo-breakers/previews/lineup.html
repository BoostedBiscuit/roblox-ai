<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Echo Breakers · cast + Echoes</title>
<link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../fonts/fonts-jp.css">
<style>
  html,body{margin:0;background:#0b0f1e;overflow:hidden}
  #labels{position:absolute;inset:0;pointer-events:none;font-family:Montserrat,sans-serif}
  .lab{position:absolute;bottom:4.5%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 6px #000}
  .lab b{display:block;font-weight:900;font-size:34px;letter-spacing:.02em}
  .lab i{display:block;font-style:normal;font-family:Inter,sans-serif;font-weight:700;font-size:20px;opacity:.85;margin-top:2px}
  .lab span{display:block;font-family:'Dela Gothic One',sans-serif;font-size:30px;margin-top:6px}
  h1{position:absolute;top:2.5%;left:0;right:0;text-align:center;margin:0;color:#fff;font:900 52px Montserrat,sans-serif;letter-spacing:.06em;text-shadow:0 3px 10px #000}
  h1 small{display:block;font:700 22px Inter,sans-serif;letter-spacing:.2em;opacity:.8;margin-top:6px}
</style></head><body>
<h1>ECHO BREAKERS<small>THE CAST AND THEIR ECHOES</small></h1><div id="labels"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../engine/vendor/CopyShader.js"></script><script src="../engine/vendor/LuminosityHighPassShader.js"></script>
<script src="../engine/vendor/EffectComposer.js"></script><script src="../engine/vendor/RenderPass.js"></script>
<script src="../engine/vendor/ShaderPass.js"></script><script src="../engine/vendor/UnrealBloomPass.js"></script>
<script src="../engine/common.js"></script><script src="../engine/mood.js"></script><script src="../engine/characters.js"></script>
<script src="../engine/animations.js"></script><script src="../engine/cast.js"></script><script src="../engine/echoes.js"></script><script src="../engine/glow.js"></script>
<script>
document.fonts.load('400 30px "Dela Gothic One"').catch(() => {}).then(() => {
  const W = innerWidth, H = innerHeight;
  const renderer = RT.mood.renderer(null, { preserve: true }); renderer.setPixelRatio(1); renderer.setSize(W, H); document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(27, W / H, 0.1, 500);
  const env = RT.mood.create(scene, renderer, { mood: 'studio' });
  scene.background = new THREE.Color('#121a33'); scene.fog = null;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.MeshStandardMaterial({ color: '#1c2747', roughness: 0.8 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const A = RT.anim, C = RT.cast, E = RT.echoes;
  const pairs = [
    ['KAI REYES', 'HIBIKI', '響', C.kai(), E.hibiki(), 'determined', 'idle', 'crossArms'],
    ['MIRA SANTOS', 'KAGEROU', '陽炎', C.mira(), E.kagerou(), 'calm', 'crossArms', 'present'],
    ['TOBI GRANT', 'OMAMORI', 'お守り', C.tobi(), E.omamori(), 'scared', 'tremble', null],
    ['RIKU HALE', 'TSURARA', '氷柱', C.riku(), E.tsurara(), 'cold', 'handsOnHips', 'idle'],
    ['MAESTRO VAHL', 'SHŪEN', '終焉', C.vahl(), E.shuen(), null, 'present', 'raiseHand'],
  ];
  const X = [-10.5, -5.2, 0, 5.2, 10.8], T = 1.3, labels = document.getElementById('labels');
  pairs.forEach(([who, echo, kanji, ch, ec, face, mv, emv], i) => {
    ch.position.set(X[i], 0, 1.2); scene.add(ch); A.set(ch, mv, T); if (face) ch.rig.setFace(face); ch.rig.update(T);
    ec.position.set(X[i] + (i === 2 ? 0.9 : 0), i === 2 ? 1.2 : 0.35, i === 4 ? -3.6 : -0.6); if (i === 4) ec.scale.setScalar(0.72);
    scene.add(ec); if (emv) A.set(ec, emv, T + i); ec.echo.update(T + i * 0.7, { power: 1 });
    if (ec.echo.orchestra) ec.echo.orchestra.visible = false;
    const el = document.createElement('div'); el.className = 'lab'; el.innerHTML = `<b>${who}</b><i>ECHO: ${echo}</i><span>${kanji}</span>`; labels.appendChild(el);
    el.style.left = ((i + 0.5) / 5 * 100) + '%';
  });
  camera.position.set(0, 3.4, 31); camera.lookAt(0, 3.0, 0); env.follow(camera); env.shadowFocus(0, 0, 0, 16);
  // spread the labels under each pair (project the feet to the screen)
  [...labels.children].forEach((el, i) => { const v = new THREE.Vector3(X[i], 0, 1.2).project(camera); el.style.left = ((v.x * 0.5 + 0.5) * 100) + '%'; });
  const glow = RT.glow.create(renderer, scene, camera, { strength: 0.9, radius: 0.6, scale: 0.5 });
  glow.render(); window.sceneReady = true;
}).catch((e) => { window.sceneError = String(e.stack || e); });
</script></body></html>
