(function () {

    return { w, x, z0, i, path: A.path([[x, z0], [x + (i % 2 ? 0.6 : -0.6), 70]], 0.95, 0, 0.42) }; });

      else { milo.rig.setEyes('open'); milo.rig.setFace(s.milo === 'scream' && t > s.screamT ? 'scream' : 'scared'); milo.rig.setMouth(s.milo === 'scream' && t > s.screamT); }
      milo.rig.update(t);
    }
    if (s.milo === 'run' || s.milo === 'flee') {
      const t0 = s.milo === 'run' ? s.runT : s.t0 + 0.25;
      const p = A.path([[MILO_SPOT[0], MILO_SPOT[2]], [4.6, 24]], 4.6, t0, 0.75)(t);
      const sink = Math.max(0, p.z) * 0.16;
      milo.position.set(p.x, gy(p.x, p.z) - sink, p.z); milo.rotation.y = p.yaw; A.set(milo, p.moving ? 'run' : 'idle', t, { phase: p.phase });
      milo.rig.setEyes('open'); milo.rig.setFace('scream'); milo.rig.setMouth(true); milo.rig.update(t);
    }

    // the dogs: howl (head up), then all turn toward the pier
    dogs.forEach((d, i) => {
      d.update(t); const h = dogHead(d);
      const howl = s.sc === 20 || s.sc === 21;
      if (howl) { h.rotation.x = -1.0 + Math.sin(t * 3 + i) * 0.05; }
      if (s.dogsTurn) { const k = ease(clamp((t - s.t0) / 0.35, 0, 1)); d.rotation.y = lerp(d.rotation.y, yawTo([d.position.x, 0, d.position.z], [PIER_SPOT.x, 0, PIER_SPOT.z]), k); h.rotation.x = lerp(-1.0, -0.25, k); h.rotation.y = 0; }
    });

    // the phone: in her hand (scene 1, dawn), or propped on the stilt filming the beach
    phone.visible = !!s.phoneAt && !s.footage;
    if (s.phoneAt === 'hand') { phone.position.set(20.6, 1.6, -12.0); phone.rotation.set(-0.35, -2.2, 0); phone.userData.setScreen(t < W(0, 'midnight') ? '23:59' : '00:00', false, '#3a0a0a'); }
    if (s.phoneAt === 'stilt') { phone.position.copy(PHONE_AT); phone.rotation.set(-0.12, Math.atan2(PHONE_BACK.x, PHONE_BACK.z), 0);
      const sc = s.screen || ['23:58', true]; phone.userData.setScreen(s.screenAt && t < s.screenAt ? '23:59' : sc[0], sc[1], sc[2]); }
    if (s.phoneAt === 'hand2') { nara.rig.gripR.updateWorldMatrix(true, false); phone.position.setFromMatrixPosition(nara.rig.gripR.matrixWorld).add(V3(0, 0.05, 0)); phone.lookAt(head(nara));   // the screen faces her
      if (s.screenFlip) phone.userData.setScreen(t < s.screenFlip ? '23:59' : '00:00', false, '#3a0a0a'); else phone.userData.setScreen(...(s.screen || ['', false])); }

    // camera
    RT.camera.apply(camera, s, t);
    if (s.blur) { const k = clamp((t - s.t0 - 0.12) / 0.3, 0, 1); shadow.visible = k > 0 && k < 1; if (shadow.visible) { shadow.position.copy(camera.position).add(camera.getWorldDirection(tmpV).multiplyScalar(1.6)).add(V3(lerp(-1.8, 1.8, k), -1.5, 0)); shadow.rotation.y = Math.PI / 2; A.set(shadow, 'run', t * 2); shadow.rig.update(t); } }
    faceLight.intensity = 0;
    if (s.focusOn) { const F = s.focusOn(); faceLight.position.copy(F).add(camera.position.clone().sub(F).setY(0).normalize().multiplyScalar(1.3)).add(V3(0, 0.55, 0));
      faceLight.intensity = s.key ? s.key[3] : s.mood === dawn ? 0.6 : 1.0; }
    if (s.keyFlood) { faceLight.position.copy(head(nara)).add(V3(0.8, 0.2, 1.4)); faceLight.intensity = 2.4 * ease(clamp((t - s.floodT) / 0.5, 0, 1)) + 0.4; }
    camera.getWorldDirection(tmpV);
    env.follow(camera); env.shadowFocus(camera.position.x + tmpV.x * 6, camera.position.y + tmpV.y * 6, camera.position.z + tmpV.z * 6, s.sc === 13 || s.sc === 15 || s.sc === 17 || s.sc === 22 ? 10 : 24);
    // the eye: opens at midnight, closes at dawn (except the last shots), always watching Nara
    eye.place(camera);
    let open = s.eye === 'open' ? clamp((t - s.eyeT) / 0.8, 0, 1) : s.eye ? 1 : 0;
    eye.group.visible = open > 0.001 || s.eye === 'open';
    eye.set(open, (s.footage && shadow.visible) ? head(shadow) : nara.visible ? head(nara) : V3(15, 1, -10), t);
    if (rec) { rec.style.opacity = s.footage ? '1' : '0'; if (s.footage) rec.querySelector('.ts').textContent = `00:00:${String(41 + Math.floor(t - S(14))).padStart(2, '0')}`; }
  }

  // post effects for time t: grade, glow, depth blur, motion blur; whip pans, zoom punches, colour split at cuts; footage glitch
  function fxAt(t) {
    const s = shots.at(t), fx = Object.assign({ grade: 1, bloom: 0.9, vignette: 0.6, grain: 0.13, t }, s.fx);
    if (s.focusOn) fx.focus = camera.position.distanceTo(s.focusOn()); else if (s.focusDist) fx.focus = s.focusDist;
    const next = shots.shots[s.i + 1];
    if (s.whipOut && next) fx.whip = s.whipOut * clamp(1 - (next.t0 - t) / 0.16, 0, 1);
    if (s.whipIn) fx.whip = s.whipIn * clamp(1 - (t - s.t0) / 0.16, 0, 1);
    if (s.blur) { const k = clamp((t - s.t0 - 0.12) / 0.3, 0, 1); if (k > 0 && k < 1) fx.whip = 0.9 * Math.sin(k * Math.PI); }
    if (s.punch && t > s.punch) { const k = Math.exp(-(t - s.punch) * 8); fx.zoom = 0.9 * k; fx.ca = (fx.ca || 0) + 0.8 * k; }
    if (s.screamT && t > s.screamT) { const k = Math.exp(-(t - s.screamT) * 5); fx.ca = (fx.ca || 0) + 1.2 * k; fx.zoom = 0.5 * k; }
    for (const c of shots.cuts()) { const k = clamp(1 - Math.abs(t - c) / 0.08, 0, 1); fx.ca = (fx.ca || 0) + 0.45 * k; }
    if (s.footage) fx.lift = 0.02;
    if (s.footage) fx.glitch = (s.fx.glitch || 0) * (0.35 + 0.65 * (Math.sin(t * 37) > 0.5 ? 1 : 0)) + (t - s.t0 < 0.1 ? 0.8 : 0);
    if (s.under && camera.position.y < 0.05) { fx.lift = -0.04; fx.vignette = 0.85; fx.bloom = 1.3; }
    return fx;
  }
  function render(t) {
    const dt = 1 / 30;
    if (t >= dt && shots.at(t - dt) === shots.at(t)) { frame(t - dt); post.capturePrev(camera); } else post.clearPrev();
    frame(t);
    post.render(scene, camera, fxAt(t));
  }
  const cuts = shots.cuts();
  const black = (t) => Math.max(clamp(1 - t / 0.35, 0, 1), (t > W(3, 'reach') + 0.38 && t < S(4) - 0.15) ? 1 : 0, t > TITLE_T ? 0.55 * clamp((t - TITLE_T) / 0.4, 0, 1) : 0);

  RT.player.start({
    name: 'ep1', duration: DURATION, renderer, scene, camera, frame, render, narration: NAR, speakers: {},
    black, white: () => 0, audio: '../audio/mix/ep1_mix.mp3',
    title: { t0: TITLE_T + 0.1, html: '<div class="t1" style="color:#ff4a3a;text-shadow:0 0 calc(var(--u)*6) rgba(255,40,20,.6),0 calc(var(--u)*.6) calc(var(--u)*1.2) #000">THE MIDNIGHT SEA</div><div class="t2">AN “IN THIS TOWN” STORY</div><div class="t3" style="color:#ffe45c">Follow for more.</div>' },
    menu: { title: 'The Midnight Sea', sub: 'In this town, every night at midnight, the sea turns red…' },
    // two thumbnail options: 1 = the eye over the red sea, 2 = the phone footage (black eyes)
    thumbnail(n) {
      render(n === '2' ? 60.85 : 3.45);
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;left:4%;right:4%;top:' + (n === '2' ? '60%' : '9%') + ';text-align:center;font:900 calc(var(--u)*13.5) Montserrat,Arial Black,sans-serif;line-height:1.0;color:#fff;-webkit-text-stroke:calc(var(--u)*1.3) #000;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.9) 0 #000';
      d.innerHTML = n === '2' ? 'IT WAS<br><span style="color:#ffe45c">ME?!</span>' : 'THE SEA TURNS<br><span style="color:#ffe45c">RED</span> AT MIDNIGHT';
      document.getElementById('stage').appendChild(d);
    },
  });
  const stage = document.getElementById('stage');
  rec = document.createElement('div');
  rec.innerHTML = '<div style="position:absolute;left:7%;top:6%;display:flex;align-items:center;gap:calc(var(--u)*1.6);font:800 calc(var(--u)*4.2) Inter,system-ui,sans-serif;color:#fff;text-shadow:0 0 6px #000"><span style="width:calc(var(--u)*3);height:calc(var(--u)*3);border-radius:50%;background:#ff2a2a;display:inline-block"></span>REC</div>' +
    '<div class="ts" style="position:absolute;right:7%;top:6%;font:700 calc(var(--u)*4) ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 0 6px #000">00:00:41</div>' +
    '<div style="position:absolute;inset:4%;border:calc(var(--u)*0.5) solid rgba(255,255,255,0.75);clip-path:polygon(0 0,12% 0,12% 0.6%,0.9% 0.6%,0.9% 7%,0 7%,0 93%,0.9% 93%,0.9% 99.4%,12% 99.4%,12% 100%,0 100%,0 0,100% 0,100% 7%,99.1% 7%,99.1% 0.6%,88% 0.6%,88% 0,100% 0,100% 100%,88% 100%,88% 99.4%,99.1% 99.4%,99.1% 93%,100% 93%,100% 100%)"></div>';
  rec.style.cssText = 'position:absolute;inset:0;pointer-events:none;opacity:0;';
  stage.insertBefore(rec, document.getElementById('cap'));
})();
