+0.6   narrator  In this town, a giant Eye opens in the sky at midnight. If you see it… you walk into the sea.
+0.5   narrator  Not just in the sky. In a window. A puddle. Even a black phone screen.
+0.55  narrator  It stays open for one hour. The only way to stop someone: cover their eyes before the water reaches their knees.
+0.7   narrator  Tonight, Old Bram forgot. He looked up from the pier… and walked straight into the red water.
+0.6   narrator  Milo and I were home alone. Shutters closed. Mirrors covered. And Milo whispered what he always does: "I just want to see it once."
+0.7   narrator  At twelve-oh-five, the wind ripped our shutter open and cracked the glass. I threw a blanket over it. It sliced my hand.
+0.55  narrator  Then Milo opened the front door. His whale was still on the porch.
+0.5   narrator  I dragged him back… and saw it. In the porch window. Staring at me.
+0.5   narrator  My legs started walking. I couldn't stop them.
+0.6   narrator  Milo squeezed his eyes shut… and followed the sound of my footsteps.
+0.5   narrator  The water hit my ankles. My shins. Then two small hands covered my eyes.
+0.6   narrator  I stopped. But we were outside, under the open sky. Forty minutes left.
+0.7   narrator  We crawled to the pier, eyes shut. Milo let go of his whale to hold my hand. The tide took it.
+0.6   narrator  Under the pier, my phone slipped out. Face up. A black mirror. Red light crawled across it… the Eye was looking for us.
+0.6   narrator  "Close your eyes," I told Milo. I shut mine… and turned the screen to the sky.
+0.6   narrator  The Eye saw itself. And for the first time… something else walked into the sea.
+0.9   narrator  Then Milo's hand slipped out of mine. He never closed his eyes.
+0.5   narrator  He finally saw it. And now he was following it into the water.
+0.7   narrator  I couldn't look either. So I shut my eyes and ran toward his splashing. Just like he did for me.
+0.5   narrator  The water reached my shins. On Milo, that's almost his knees. I grabbed his face and covered his eyes.
+0.6   narrator  He stopped. The red drained from the water. We never got Old Bram back. Or the whale.
+1.0   narrator  The next night, at midnight, we opened every shutter. And the sky stayed empty.
+0.9   narrator  Milo doesn't ask to see it anymore.
