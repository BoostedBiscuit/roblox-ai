  for (const s of shots.shots) s.t1 = shots.shots[s.i + 1] ? shots.shots[s.i + 1].t0 : DURATION;

  // ---------- the world at time t ----------

    if (C === 'facesWall') { put(nara, -1.7, 15.6, 0); A.apply(nara, Object.assign(A.pose('idle', t), { hx: -0.08 })); nara.rig.setFace('shocked'); }
    if (C === 'hears') { put(nara, -1.7, 15.6, 0.15); const k = ease(clamp((t - T.voice1 + 0.05) / 0.18, 0, 1)); A.apply(nara, Object.assign(A.pose('idle', t), { hy: 1.25 * k, turn: 0.3 * k })); nara.rig.setFace(k > 0.5 ? 'shocked' : 'scared'); }
    if (C === 'run') { const p = walkOn(nara, [[-1.6, 15.4], [RUN_END, 15.3]], 4.6, shotOf(18).t0 - 0.2, t, { run: true, stride: 0.8 });
      nara.rig.setFace('worried'); if (p.x > RUN_END - 0.05) { A.apply(nara, Object.assign(A.pose('idle', t), { lean: -0.18, aLf: 0.6, aRf: 0.5 })); nara.rig.setFace('shocked'); } }
    if (C === 'toB') { const k = ease(clamp(lt / 0.3, 0, 1)); put(nara, lerp(RUN_END, 5.4, k), lerp(15.3, 14.55, k), lerp(Math.PI / 2, Math.PI, k)); A.apply(nara, Object.assign(A.pose('run', t, { phase: t * 9 }), { lean: -0.1 })); nara.rig.setFace('shocked'); }

      p.b.visible = on; if (on) { p.b.position.set(p.x + p.vx * dt, Math.max(0.03, 4.3 - 4.9 * dt * dt), p.z); p.b.rotation.set(p.spin + dt * 5, 0, p.spin * 2 + dt * 4); } }
    for (const c of [nara, juno, crow]) { c.rig.update(t); if (!c.visible) c.position.y = -999; }

    const dist = [];
    if (s.shiver) dist.push({ x: s.shiver[0], z: s.shiver[1], r: s.shiver[2], a: 1, mode: 'shiver', t });
    if (C === 'crawlIn') dist.push({ x: nara.position.x, z: nara.position.z, r: 1.1, a: 0.5, mode: 'push' });

  // natural colours, soft glow and depth; a little colour split on cuts and punches (the reference look)
  function fxAt(t) {
