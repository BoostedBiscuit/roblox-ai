<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
  'use strict';
  const { clamp, lerp, ease, easeOut } = RT, C = RT.characters, A = RT.anim, V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const RENDER = RT.player.RENDER || !!RT.player.THUMB;

  // ---------- narration timing (L(0) = "In this town…", L(n) = story line n) ----------
  const NAR = window.RT_NARRATION.ep2, L = (n) => NAR.lines[n], S = (n) => L(n).start, E = (n) => L(n).end;
  const W = (n, w) => { const x = L(n).words.find((k) => k.w.toLowerCase().replace(/[^a-z0-9']/g, '') === w); return x ? x.start : S(n); };
  const TITLE_T = E(26) + 1.6, DURATION = +(TITLE_T + 6.4).toFixed(2);

  // ---------- renderer, camera, light ----------
  const renderer = RT.mood.renderer(null, { preserve: RENDER });
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 9 / 16, 0.1, 4200);
  const env = RT.mood.create(scene, renderer, { mood: 'studio', shadowSize: 2048 });
  const key = new THREE.DirectionalLight('#fff1e0', 0); scene.add(key); scene.add(key.target);   // soft face light for close-ups (no shadows)
  const MOOD = RT.capital.MOODS;

  // ---------- places (one city; each place is centered in its middle) ----------
  const city = RT.capital.skyline(); scene.add(city);
  const station = RT.capital.station(), court = RT.capital.trainingCourt(), show = RT.capital.showStage(), roof = RT.capital.rooftop();
  const SETS = { city: station, court, show, roof };
  for (const k in SETS) { scene.add(SETS[k]); SETS[k].visible = false; }
  const CS = court.spots, SS = show.spots, RS = roof.spots, RY = RS.Y;

  // ---------- cast ----------
  const rhea = C.rhea(), haskin = C.haskin(), dax = C.dax(), juno = C.juno(), vire = C.vire();
  rhea.name = 'Rhea'; haskin.name = 'Haskin'; dax.name = 'Dax'; juno.name = 'Juno'; vire.name = 'Vire';
  const yawTo = (from, to) => Math.atan2(to[0] - from[0], to[2] - from[2]);
  const head = (ch, dy = 0) => { const v = new THREE.Vector3(); ch.rig.head.getWorldPosition(v); v.y += dy; return v; };
  const handPos = (ch, side = 'R') => { const v = new THREE.Vector3(); (side === 'L' ? ch.rig.handL : ch.rig.handR).getWorldPosition(v); return v; };
  // Haskin's flask moves into his right hand (he has it at the station, NOT on the roof)
  const flask = haskin.rig.props.flask; flask.parent.remove(flask); haskin.rig.hold('R', flask); flask.position.set(0, -0.1, 0.05); flask.rotation.set(0, Math.PI / 2, 0);
  // props: a training sword, two bows, a sling, Juno's rod
  const wood = RT.plastic('#8a5a34', { roughness: 0.6 }), steel = RT.metal('#d5dae2', { roughness: 0.25 }), goldM = RT.metal('#e2b54a');
  const sword = new THREE.Group(); sword.add(RT.mesh(new THREE.BoxGeometry(0.1, 1.35, 0.22), steel).translateY(0.85)); sword.add(RT.mesh(new THREE.BoxGeometry(0.5, 0.08, 0.12), goldM).translateY(0.16)); sword.add(RT.mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.32, 8), wood));
  rhea.rig.hold('R', sword); sword.rotation.set(Math.PI / 2, 0, 0); sword.position.set(0, -0.05, 0.05);
  // bow: the arc's belly is at the grip (origin) and points forward (+z), the string 0.66 behind it, limbs up and down
  const makeBow = () => { const b = new THREE.Group(), inner = new THREE.Group(); b.add(inner); inner.rotation.y = -Math.PI / 2;
    const arc = RT.mesh(new THREE.TorusGeometry(0.95, 0.045, 6, 24, Math.PI * 0.8), wood); arc.rotation.z = -Math.PI * 0.4; arc.position.x = -0.95; inner.add(arc);
    const str = RT.mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.8, 4), RT.plastic('#f2efe8')); str.position.x = 0.95 * Math.cos(Math.PI * 0.4) - 0.95; inner.add(str);
    inner.add(RT.mesh(new THREE.BoxGeometry(0.14, 0.3, 0.14), goldM)); scene.add(b); return b; };
  const daxBow = makeBow(), rheaBow = makeBow();
  const holdBow = (bow, ch) => { if (!bow.visible) return; ch.updateMatrixWorld(true); bow.position.copy(handPos(ch, 'L')); bow.rotation.set(0, ch.rotation.y, 0); };
  const fwd = (ch) => V3(Math.sin(ch.rotation.y), 0, Math.cos(ch.rotation.y));
  const sling = new THREE.Group(); sling.add(RT.mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.9, 4), RT.plastic('#7a5233')).translateY(-0.45));
  sling.add(RT.mesh(new THREE.SphereGeometry(0.1, 8, 6), RT.plastic('#6b3b22')).translateY(-0.92)); rhea.rig.hold('R', sling);
  const whirl = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.035, 4, 40), new THREE.MeshBasicMaterial({ color: '#f2e6c8', transparent: true, opacity: 0.45 })); whirl.rotation.x = Math.PI / 2; scene.add(whirl);
  const rod = RT.mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.6, 6), RT.metal('#9aa3ad')); rod.rotation.x = Math.PI / 2; rod.position.set(0, -0.08, 0.75); juno.rig.hold('R', rod);
  // the Capital: rich citizens (bright clothes) at the station, guards, other tributes, the Council
  const citizens = [[-3, -3.2], [-5.5, 0.5], [-1.5, 4.2], [1.0, 5.6], [5.5, 5.8], [-7.5, -1.8], [-3, 7.4], [9.5, 5.6], [-6, 5], [1.2, -4.6], [12.5, 4.0], [-9.5, 2.6]]
    .map(([x, z], i) => { const c = C.citizen(500 + i * 7, { palette: 'capital', kid: false }); c.name = 'Citizen ' + (i + 1); scene.add(c); return { c, x, z, i }; });
  const guards = [[-8, -3.6], [16.5, -3.6]].map(([x, z], i) => { const g = C.guard({ seed: 40 + i }); g.name = 'Guard ' + (i + 1); scene.add(g); return { g, x, z }; });
  const s1a = C.tribute(1, 3), s1b = C.tribute(1, 8, { hair: 'spiky' }); s1a.name = 'Sector 1 A'; s1b.name = 'Sector 1 B';
  const trainees = [C.tribute(2, 4), C.tribute(4, 6), C.tribute(5, 2), C.tribute(6, 9), C.tribute(8, 5)]; trainees.forEach((x, i) => (x.name = 'Trainee ' + (i + 1)));
  const council = [C.citizen(901, { palette: 'capital', top: 'vest', kid: false }), C.citizen(907, { palette: 'capital', top: 'shirt', kid: false }), C.citizen(913, { palette: 'capital', top: 'vest', kid: false })];
  council.forEach((x, i) => (x.name = 'Councillor ' + (i + 1)));
  const PEOPLE = [rhea, haskin, dax, juno, vire, s1a, s1b, ...trainees, ...council];
  for (const p of PEOPLE) scene.add(p);
  const sliders = [whirl];

  // who is speaking (Adam voices every line; the character's mouth moves on their own lines)
  const SPEAK = { haskin: [haskin], dax: [dax], juno: [juno], vire: [vire], rhea: [rhea] };
  function lips(t) {
    for (const k in SPEAK) for (const ch of SPEAK[k]) ch.rig.setMouth(false);
    const l = NAR.lines.find((x) => SPEAK[x.who] && t >= x.start && t < x.end);
    if (!l) return;
    const n = Math.floor(t * 7.5), open = RT.hash(n * 3.1 + l.start) > 0.3 && t * 7.5 - n < 0.72;
    for (const ch of SPEAK[l.who]) ch.rig.setMouth(open);
  }

  // =====================================================================================
  // THE STATION (lines 0–7). The train glides in from the east and stops at x = 0; doors open at DOOR_T.
  // =====================================================================================
  const T_ARR = S(2) - 0.5, DOOR_T = S(2) - 0.35;
  const trainX = (t) => 260 * Math.pow(1 - clamp(t / T_ARR, 0, 1), 3);
  const RHEA_C = [3.4, 0, 0.6], HASK_C = [4.9, 0, 1.5], DAX_C = [7.2, 0, 1.0];
  const playRheaC = A.actor(rhea, [
    { at: 0, pos: [4, 0, -8.4], yaw: 0, move: 'idle', face: 'neutral' },
    { at: DOOR_T + 0.45, to: [4, 0, -5.6], speed: 1.4, gait: 'walk', move: 'look', opts: { turn: 0.25, nod: -0.4, dur: 0.6 }, yaw: 0.1 },
    { at: W(2, 'glass') - 0.1, to: RHEA_C, speed: 1.25, gait: 'walk', move: 'look', opts: { turn: -0.2, nod: -0.25 }, yaw: 0.25, face: 'neutral' },
    { at: S(4) - 0.4, yaw: yawTo(RHEA_C, HASK_C), move: 'idle', face: 'neutral' },
    { at: S(5) - 0.1, yaw: yawTo(RHEA_C, DAX_C), move: 'idle', face: 'neutral' },
    { at: S(6) + 0.3, move: 'idle', face: 'determined' },
  ]);
  const playHaskinC = A.actor(haskin, [
    { at: 0, pos: [4.6, 0, -8.6], yaw: 0, move: 'idle', face: 'neutral' },
    { at: DOOR_T + 1.6, to: [4.6, 0, -5.4], speed: 1.2, gait: 'walk', move: 'idle' },
    { at: DOOR_T + 3.0, to: HASK_C, speed: 1.2, gait: 'walk', move: 'idle', yaw: yawTo(HASK_C, RHEA_C) },
    { at: S(4) - 0.1, move: 'talk', opts: { seed: 2 }, face: 'neutral' },
    { at: E(4) + 0.2, move: 'idle', yaw: yawTo(HASK_C, DAX_C) },
  ]);
  const playDaxC = A.actor(dax, [
    { at: 0, pos: [12.6, 0, -8.4], yaw: 0, move: 'idle', face: 'smirk' },
    { at: S(5) - 0.5, to: [12.6, 0, -5.8], speed: 1.5, gait: 'walk', move: 'idle', yaw: yawTo([12.6, 0, -5.8], RHEA_C) },
    { at: S(5) + 0.9, via: [[11.8, 0, 0.2]], to: DAX_C, speed: 1.45, gait: 'walk', move: 'handsOnHips', yaw: yawTo(DAX_C, RHEA_C), face: 'smirk' },   // (around the canopy column at x 10)
    { at: S(6) - 0.1, move: 'talk', opts: { seed: 5 } },
    { at: E(6) + 0.1, move: 'laugh' },
    { at: E(7) - 0.2, move: 'crossArms', face: 'smirk' },
  ]);
  const S1A_C = [9.6, 0, 2.8], S1B_C = [10.4, 0, 0.7];
  const playS1a = A.actor(s1a, [{ at: 0, pos: [20.6, 0, -8.4], yaw: 0, move: 'idle', face: 'smirk' }, { at: S(5) + 0.3, to: [20.6, 0, -5.8], speed: 1.4, gait: 'walk' }, { at: S(5) + 2.2, to: S1A_C, speed: 1.6, gait: 'walk', move: 'crossArms', yaw: yawTo(S1A_C, RHEA_C) }, { at: E(6) + 0.1, move: 'laugh' }]);
  const playS1b = A.actor(s1b, [{ at: 0, pos: [20.6, 0, -8.4], yaw: 0, move: 'idle', face: 'smirk' }, { at: S(5) + 0.9, to: [20.0, 0, -5.8], speed: 1.4, gait: 'walk' }, { at: S(5) + 2.5, to: S1B_C, speed: 1.6, gait: 'walk', move: 'handsOnHips', yaw: yawTo(S1B_C, RHEA_C) }, { at: E(6) + 0.15, move: 'laugh' }]);
  function cityCast(t) {
    station.update(t, { trainX: trainX(t), doors: ease(clamp((t - DOOR_T) / 0.6, 0, 1)) });
    playRheaC(t); playHaskinC(t); playDaxC(t); playS1a(t); playS1b(t);
    rhea.visible = t > DOOR_T + 0.25; haskin.visible = t > DOOR_T + 1.3; dax.visible = s1a.visible = s1b.visible = t > S(5) - 0.7;
    // citizens stare at Rhea (some point, some whisper), then laugh with Dax
    const rp = rhea.position;
    for (const { c, x, z, i } of citizens) {
      c.visible = true; c.position.set(x, 0, z); c.rotation.y = yawTo([x, 0, z], [rp.x, 0, rp.z]) + (i % 3 - 1) * 0.15;
      const laugh = t > E(6) + 0.1 + (i % 4) * 0.08 && t < E(7) + 0.6;
      if (laugh) A.set(c, 'laugh', t - E(6) + i * 0.13);
      else if (i % 4 === 1 && t > S(2) + 3) A.set(c, 'point', t - S(2) - 3);
      else A.set(c, i % 3 === 0 ? 'crossArms' : 'idle', t + i);
      c.rig.setFace(laugh ? 'smiling' : i % 2 ? 'smirk' : 'neutral');
      c.rig.update(t);
    }
    for (const { g, x, z } of guards) { g.visible = true; g.position.set(x, 0, z); g.rotation.y = Math.PI * 0.15 * Math.sign(-x); A.set(g, 'idle', t + x); g.rig.update(t); }
    flask.visible = true; sword.visible = daxBow.visible = rheaBow.visible = sling.visible = rod.visible = false;
    for (const p of [rhea, haskin, dax, s1a, s1b]) p.rig.update(t);
  }

  // =====================================================================================
  // THE TRAINING COURT (lines 8–16)
  // =====================================================================================
  const COURT_T = S(8) - 0.9;
  const M_SW = W(8, 'swords') - 0.15, M_RO = W(8, 'ropes') - 0.12, M_CL = W(8, 'climbing') - 0.12, M_FALL = W(8, 'walls') + 0.25, M_TER = W(8, 'i') - 0.12;
  const DUMMY1 = [-14.5, 0, 15.6], ROPE_AT = [-5.3, 0, 10.05], WALL_AT = [-13, 0, 7.75];
  const DAX_LINE = [12.5, 0, 30.2], TGT = V3(12.5, 2.0, 7.95), RHEA_LINE = [12.5, 0, 33.6];
  const RHEA_WATCH = [-12.6, 0, 27.4], JUNO_BENCH = [CS.JX, 0, CS.JZ + 1.3], JUNO_WIRE = [CS.NET.x + 0.3, 0, CS.NET.z + 2.3];
  const NET_DROP = W(11, 'drops') - 0.12;
  const DAX_SHOTS = [W(9, 'hit') - 0.05, W(9, 'target') + 0.2, W(9, 'eyes') - 0.1];
  const RHEA_SHOTS = [W(14, 'missed') - 0.1, W(14, 'three') - 0.05, W(14, 'times') + 0.25];
  const SLING_T = W(15, 'chase') - 0.35, THROW = W(15, 'center') - 0.42, HIT = THROW + 0.4;
  const MISS = [V3(10.6, 0.06, 12.4), V3(15.6, 3.2, 5.4), V3(13.9, 0.06, 10.2)];
  const DAX_HITS = [V3(0.12, 0.08, 0), V3(-0.1, -0.05, 0), V3(0.03, 0.16, 0)];
  const flyArrow = (a, t0, from, to, t, dur) => {
    if (t < t0) { a.visible = false; return; }
    const k = clamp((t - t0) / dur, 0, 1), p = from.clone().lerp(to, k); p.y += Math.sin(k * Math.PI) * from.distanceTo(to) * 0.03;
    a.visible = true; a.position.copy(p); a.lookAt(to.clone().add(to.clone().sub(from).normalize()));
  };
  const LAST_T = S(13) - 0.7;                          // the last day: the court is empty, only Rhea and the Council
  function courtCast(t) {
    const testDay = t >= LAST_T;
    court.update(t, { net: clamp((t - NET_DROP) / 0.35, 0, 1) });

    { t0: S(22) - 0.3, set: 'show', mood: 'capitalShow', pos: () => head(dax, -0.05).add(V3(-1.1, 0.05, 2.1)), look: () => head(dax, 0.02), fov: [38, 36], subj: [dax] },
    { t0: S(23) - 0.2, set: 'show', mood: 'capitalShow', fov: [40, 38], shake: 0.006, subj: [dax], pos: () => head(dax, -0.9).add(fwd(dax).multiplyScalar(2.6)).add(V3(0.3, 0, 0)), look: () => head(dax, -1.0) },
    { t0: W(23, 'just') - 0.12, set: 'show', mood: 'capitalShow', pos: () => head(dax, -0.05).add(V3(-0.9, 0.0, 1.7)), look: () => head(dax, -0.1), fov: [32, 30], subj: [dax] },
    // --- the roof ---
    { t0: ROOF_T, set: 'roof', mood: 'capitalNight', pos: [[-2.4, RY + 2.8, 22.0], [-2.0, RY + 2.6, 22.6]], look: [[1.6, RY + 0.4, 34], [1.6, RY + 0.3, 34]], fov: [54, 52], subj: [rhea] },
    { t0: W(24, 'he') - 0.12, set: 'roof', mood: 'capitalNight', pos: () => head(haskin, -0.5).add(fwd(haskin).multiplyScalar(3.0)).add(V3(0.6, -0.1, 0)), look: () => head(haskin, -0.8), fov: [42, 40], subj: [haskin] },
    { t0: S(25) - 0.3, set: 'roof', mood: 'capitalNight', pos: [[3.4, RY + 2.5, 28.9], [3.3, RY + 2.5, 28.8]], look: () => head(haskin, -0.1), fov: [40, 38], subj: [haskin] },
    { t0: W(25, 'built') - 0.1, set: 'roof', mood: 'capitalNight', pos: () => head(rhea, -0.05).add(fwd(rhea).multiplyScalar(1.7)).add(V3(0.2, 0.02, 0)), look: () => head(rhea, -0.05), fov: [38, 36], subj: [rhea] },
    { t0: S(26) - 0.35, set: 'roof', mood: 'capitalNight', ease: 'linear', moveDur: TITLE_T - S(26) + 0.35, fov: [40, 34], subj: [rhea],
      pos: (lt, p) => head(rhea, -0.02).add(fwd(rhea).multiplyScalar(lerp(2.3, 1.45, p))).add(V3(-0.3, 0.05, 0)), look: () => head(rhea, -0.05) },
    { t0: TITLE_T, set: 'roof', mood: 'capitalNight', pos: [[0, 170, 170], [0, 175, 150]], look: [[0, 120, -150], [0, 130, -150]], fov: [55, 52], moveDur: 6.4 },
  ]);
  for (const s of shots.shots) s.t1 = shots.shots[s.i + 1] ? shots.shots[s.i + 1].t0 : DURATION;
  const PLACE_CUTS = [COURT_T, SHOW_T, ROOF_T];
  const CUTS = shots.cuts().filter((c) => c > TITLE1[1] - 0.05 && c < TITLE_T - 0.1 && !PLACE_CUTS.includes(c));

  // ---------- everything that moves (pure function of t) ----------
  let curMood = '', curSet = '';
  function frame(t) {
    const s = shots.at(t);
    if (s.mood !== curMood) { curMood = s.mood; env.set(MOOD[s.mood]); city.setNight(s.mood === 'capitalShow' || s.mood === 'capitalNight' ? 1 : 0); }
    if (s.set !== curSet) { for (const k in SETS) SETS[k].visible = k === s.set; curSet = s.set; }
    for (const p of PEOPLE) p.visible = false;
    for (const { c } of citizens) c.visible = false; for (const { g } of guards) g.visible = false;
    if (s.set === 'city') cityCast(t); else if (s.set === 'court') courtCast(t); else if (s.set === 'show') showCast(t); else roofCast(t);
    if (s.set !== 'court') { for (const a of CS.arrows) a.visible = false; CS.stone.visible = false; }
    lips(t);
    RT.camera.apply(camera, s, t);
    env.follow(camera);
    const look = camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(s.set === 'city' && s.i < 3 ? 90 : 12).add(camera.position);
    env.shadowFocus(look.x, look.y, look.z, s.i < 3 || s.t0 === COURT_T || s.t0 === SHOW_T || s.t0 >= TITLE_T ? 60 : 16);
    key.intensity = s.subj ? (s.set === 'show' ? 0.15 : 0.35) : 0; key.position.copy(camera.position).add(V3(-1, 1.5, 0)); key.target.position.copy(look);
  }

  function black(t) {
    if (t < 0.6) return 1 - t / 0.6;
    if (t >= TITLE1[0] && t < TITLE1[1]) return 0.45;
    for (const c of PLACE_CUTS) if (t > c - 0.5 && t < c + 0.45) return 1 - Math.abs(t - c) / (t < c ? 0.5 : 0.45);   // dip to black between places
    if (t >= TITLE_T) return Math.max(0.42, clamp((t - DURATION + 0.7) / 0.7, 0, 1));
    return RT.camera.dips(t, CUTS, 0.1);
  }
  function white(t) { const fl = (c, d, a = 1) => (t >= c && t < c + d ? (1 - (t - c) / d) * a : 0); return Math.max(fl(HIT, 0.22, 0.85), fl(NET_DROP + 0.32, 0.15, 0.4), fl(TITLE_T, 0.2, 0.6)); }

  // ---------- THUMBNAILS (Part 7D): npm run render -- reaping-ep2 --thumbs → out/reaping-trials/ep2-thumb-option1.png / 2.png ----------
  function thumbnail(n) {
    const T = Number(n) || 1, stage = document.getElementById('stage');
    renderer.domElement.style.filter = 'saturate(1.25) contrast(1.08) brightness(1.03)';
    let subject, aim;
    if (T === 1) {   // "50 STEPS?!": Rhea with the sling, the stone in the bull's-eye far behind (red arrow)
      frame(THROW - 0.3);
      camera.fov = 46; camera.position.set(RHEA_LINE[0] - 1.25, 2.35, RHEA_LINE[2] - 2.35); camera.lookAt(RHEA_LINE[0] - 0.1, 2.15, RHEA_LINE[2] + 0.5); camera.updateProjectionMatrix();
      rhea.rotation.y = Math.PI + 0.35; A.set(rhea, 'slingSpin', 0.6, { throwAt: 99 }); rhea.rig.setFace('determined'); rhea.rig.setEyes('open'); rhea.rig.setMouth(false);
      subject = rhea; aim = TGT.clone();
      CS.stone.visible = true; CS.stone.position.copy(TGT).add(V3(0, 0, 0.2)); CS.stone.scale.setScalar(2.4);
      camera.position.set(RHEA_LINE[0] + 0.9, 2.3, RHEA_LINE[2] - 2.6); camera.lookAt(RHEA_LINE[0] - 0.6, 2.4, TGT.z);
    } else {         // "HE STOPPED SMILING": Vire's cold face on the balcony, Rhea small in the court below (red circle)
      frame(W(16, 'smiling') + 0.4);
      const h = head(vire, -0.02); camera.fov = 40; camera.position.copy(h).add(V3(0.55, -0.25, 1.75)); camera.lookAt(h.clone().add(V3(0.15, -0.55, 6))); camera.updateProjectionMatrix();
      vire.rig.setFace('neutral'); vire.rig.setEyes('open'); vire.rig.setMouth(false); subject = vire; aim = head(rhea, -0.6);
    }
    key.intensity = 0.6; key.position.copy(camera.position).add(V3(-1, 1, 0)); key.target.position.copy(subject.position);
    subject.rig.update(0); env.follow(camera); env.shadowFocus(subject.position.x, subject.position.y, subject.position.z, 14);
    renderer.render(scene, camera);
    const proj = (v) => { const q = v.clone().project(camera); return [(q.x * 0.5 + 0.5) * 100, (-q.y * 0.5 + 0.5) * 177.8]; };
    const [ax, ay] = proj(aim);
    const css = document.createElement('style'); css.textContent = `
      .th{position:absolute;left:0;right:0;text-align:center;font-family:Montserrat,'Arial Black',sans-serif;font-weight:900;line-height:.95;color:#fff;
          -webkit-text-stroke:calc(var(--u)*1.6) #000;paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) 0 #000,0 0 calc(var(--u)*4) rgba(0,0,0,.6);transform:rotate(-3deg);}
      .th .y{color:#ffd23f;}`;
    document.head.appendChild(css);
    const add = (html) => { const d = document.createElement('div'); d.innerHTML = html; stage.appendChild(d.firstChild); };
    if (T === 1) add('<div class="th" style="top:13%"><div class="y" style="font-size:calc(var(--u)*21)">50 STEPS?!</div></div>');
    else add('<div class="th" style="top:12%"><div style="font-size:calc(var(--u)*13.5)">HE STOPPED</div><div class="y" style="font-size:calc(var(--u)*15)">SMILING</div></div>');
    let svg;
    if (T === 1) {
      const p0 = [ax - 26, ay - 22], c = [ax - 22, ay - 2], p1 = [ax - 5, ay - 2], d = [p1[0] - c[0], p1[1] - c[1]], L2 = Math.hypot(d[0], d[1]), u = [d[0] / L2, d[1] / L2], nn = [-u[1], u[0]];
      const tip = [p1[0] + u[0] * 4, p1[1] + u[1] * 4], h1 = [p1[0] + nn[0] * 3.6, p1[1] + nn[1] * 3.6], h2 = [p1[0] - nn[0] * 3.6, p1[1] - nn[1] * 3.6], path = `M ${p0} Q ${c} ${p1}`;
      svg = `<svg viewBox="0 0 100 177.8" style="position:absolute;inset:0;width:100%;height:100%"><path d="${path}" fill="none" stroke="#000" stroke-width="5.6" stroke-linecap="round"/><path d="${path}" fill="none" stroke="#ff2a2a" stroke-width="3.4" stroke-linecap="round"/><path d="M ${tip} L ${h1} L ${h2} Z" fill="#ff2a2a" stroke="#000" stroke-width="1" stroke-linejoin="round"/></svg>`;
    } else { const rad = 8; svg = `<svg viewBox="0 0 100 177.8" style="position:absolute;inset:0;width:100%;height:100%"><ellipse cx="${ax}" cy="${ay}" rx="${rad}" ry="${rad * 1.35}" fill="none" stroke="#000" stroke-width="4.6"/><ellipse cx="${ax}" cy="${ay}" rx="${rad}" ry="${rad * 1.35}" fill="none" stroke="#ff2a2a" stroke-width="2.8"/></svg>`; }
    add(svg);
    if (window.RT_BRAND !== false) add('<img src="../brand/watermark.png" style="position:absolute;left:60%;top:10.5%;width:36%;opacity:.4">');
  }

  RT.player.start({
    name: 'ep2', duration: DURATION, renderer, scene, camera, frame, black, white,
    narration: NAR,
    speakers: { haskin: 'HASKIN', dax: 'DAX', juno: 'JUNO', vire: 'VIRE', rhea: 'RHEA' },
    noCaptions: [[TITLE1[0], TITLE1[1]], [TITLE_T, 9999]],
    hooks: [{ t0: TITLE1[0] + 0.1, t1: TITLE1[1] - 0.05, html: 'EPISODE 2<br><span style="font-size:.62em">THE CAPITAL</span>' }],
    title: { t0: TITLE_T, stagger: [0, 0.6, 1.3], html: '<div class="t1">THE REAPING<br>TRIALS</div><div class="t2">EPISODE 3 · THE ARENA OPENS<br>COMING SOON</div><div class="t3">Follow so you don\'t miss it.</div>' },
    audio: '../audio/mix/ep2_mix.mp3',
    menu: { title: 'The Reaping Trials', sub: 'Episode 2 · The Capital' },
    thumbnail,
    idleTime: (x) => 14 + (x % 3) * 0.2,
    stills: shots.shots.map((x) => +((x.t0 + x.t1) / 2).toFixed(2)).sort((a, b) => a - b),
  });
})();
