    document.head.appendChild(css);
    const add = (html) => { const d = document.createElement('div'); d.innerHTML = html; stage.appendChild(d.firstChild); };
    if (T === 1) add('<div class="th" style="top:12%"><div style="font-size:calc(var(--u)*13)">THEY COPIED</div><div class="y" style="font-size:calc(var(--u)*15)">MY TOWN?!</div></div>');
    else add('<div class="th" style="top:12%"><div style="font-size:calc(var(--u)*14)">STAY OFF</div><div class="r" style="font-size:calc(var(--u)*15)">THE ROAD!</div></div>');
    const sgn = T === 1 ? -1 : 1, p0 = [ax + 24 * sgn, ay - 24], cc = [ax + 22 * sgn, ay - 4], p1 = [ax + 6 * sgn, ay - 2], dd = [p1[0] - cc[0], p1[1] - cc[1]], L2 = Math.hypot(dd[0], dd[1]), u = [dd[0] / L2, dd[1] / L2], nn = [-u[1], u[0]];
    const tip = [p1[0] + u[0] * 4, p1[1] + u[1] * 4], h1 = [p1[0] + nn[0] * 3.6, p1[1] + nn[1] * 3.6], h2 = [p1[0] - nn[0] * 3.6, p1[1] - nn[1] * 3.6], path = `M ${p0} Q ${cc} ${p1}`;
    add(`<svg viewBox="0 0 100 177.8" style="position:absolute;inset:0;width:100%;height:100%"><path d="${path}" fill="none" stroke="#000" stroke-width="5.6" stroke-linecap="round"/><path d="${path}" fill="none" stroke="#ff2a2a" stroke-width="3.4" stroke-linecap="round"/><path d="M ${tip} L ${h1} L ${h2} Z" fill="#ff2a2a" stroke="#000" stroke-width="1" stroke-linejoin="round"/></svg>`);
    if (window.RT_BRAND !== false) add('<img src="../brand/watermark.png" style="position:absolute;left:60%;top:10.5%;width:36%;opacity:.4">');
  }

  RT.player.start({
