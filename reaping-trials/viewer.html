<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reaping Trials Viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Character + location viewer. Drag to rotate, pinch or scroll to zoom, double-tap to frame the face. */
  :root { --bg: #0c0f14; --panel: rgba(14, 18, 26, 0.86); --text: #f2f2f2; --gold: #f3c66e; --muted: #9aa3b2; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text); font-family: Inter, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; left: 8px; right: 8px; top: 8px; background: var(--panel); border-radius: 14px; padding: 10px 12px; box-sizing: border-box;
           display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 10px; font-size: 13px; backdrop-filter: blur(6px); }
  #panel label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-weight: 500; }
  #panel select, #panel button { font: 700 14px Inter, system-ui, sans-serif; color: var(--text); background: #1d2433; border: 1px solid #2e3850; border-radius: 9px; padding: 8px; min-height: 38px; }
  #panel button.on { background: var(--gold); color: #1a1208; border-color: var(--gold); }
  #title { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
  #title b { font-family: Cinzel, Georgia, serif; font-weight: 800; color: var(--gold); letter-spacing: .05em; font-size: 16px; }
  #toggle { min-height: 30px !important; padding: 4px 10px !important; }
  #panel.min > :not(#title) { display: none; }
  #hint { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; color: var(--muted); font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px #000; }
  body.static #panel, body.static #hint { display: none; }
</style>
</head>
<body>
<div id="panel">
  <div id="title"><b>THE REAPING TRIALS · Viewer</b><button id="toggle">Hide</button></div>
  <label>Character<select id="char"></select></label>
  <label>Move<select id="move"></select></label>
  <label>Face<select id="face"></select></label>
  <label>Light (mood)<select id="mood"></select></label>
  <label>Location<select id="loc"><option value="studio">Studio baseplate</option><option disabled>Sector 7 village (next step)</option></select></label>
  <label>Camera<select id="view"><option value="body">Full body</option><option value="face">Face close-up</option><option value="low">Low angle (power shot)</option></select></label>
  <label>&nbsp;<button id="spin">Auto-turn</button></label>
</div>
<div id="hint">Drag to rotate · pinch or scroll to zoom · double-tap to frame the face</div>

<!-- three.js r128 (core only). The renderer swaps in a local copy of the same file when rendering offline. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="common.js"></script>
<script src="mood.js"></script>
<script src="characters.js"></script>
<script src="animations.js"></script>
<script src="scenery.js"></script>
<script>
(function () {
  'use strict';
  // URL options (also used by tools/viewer-shots.js for screenshots):
  //   ?char=rhea&move=wave&face=smiling&mood=sunrise&view=face&yaw=0.4&t=1.5&static=1
  const q = new URLSearchParams(location.search);
  const STATIC = q.has('static');                       // render one exact frame (no clock), for screenshots
  if (STATIC) document.body.classList.add('static');

  const renderer = RT.mood.renderer(null, { preserve: STATIC });
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 3200);
  const env = RT.mood.create(scene, renderer, { mood: 'studio' });
  scene.add(RT.scenery.baseplate({ size: 160 }));

  // ---------- characters on stage ----------
  const CHARS = {
    lineup: 'Lineup (whole cast)', rhea: 'Rhea Vance', pip: 'Pip Vance', juno: 'Juno Castell', dax: 'Dax Morrow', haskin: 'Old Haskin',
    vire: 'Chancellor Vire', guard: 'Council guard', hug: 'Rhea + Pip (hug)', citizens: 'Sector 7 citizens', tributes: 'Tributes (Sectors 1–8)', crowd: 'Instanced crowd (60)',
  };
  const sel = (id, entries, value) => { const s = document.getElementById(id); s.innerHTML = entries.map(([v, l]) => `<option value="${v}">${l}</option>`).join(''); s.value = value; return s; };
  const state = { char: q.get('char') || 'lineup', move: q.get('move') || 'idle', face: q.get('face') || 'auto', mood: q.get('mood') || 'studio',
    view: q.get('view') || 'body', yaw: parseFloat(q.get('yaw') || '0'), t: parseFloat(q.get('t') || '0'), spin: false };
  const cSel = sel('char', Object.entries(CHARS), state.char);
  const mSel = sel('move', RT.anim.names.map((n) => [n, n]), state.move);
  const fSel = sel('face', [['auto', 'each one\'s default'], ...RT.EXPRESSIONS.map((n) => [n, n])], state.face);
  const moodSel = sel('mood', RT.mood.names.map((n) => [n, n]), state.mood);
  const vSel = document.getElementById('view'); vSel.value = state.view;

  let actors = [], crowd = null, stage = new THREE.Group(); scene.add(stage);
  function build() {
    while (stage.children.length) stage.remove(stage.children[0]); actors = []; crowd = null;
    const C = RT.characters, add = (ch, x, z = 0, yaw = 0, move) => { ch.position.set(x, 0, z); ch.rotation.y = yaw; stage.add(ch); actors.push({ ch, move, def: ch.rig.expression }); return ch; };
    const k = state.char;
    if (k === 'lineup') C.cast.forEach((n, i) => { const back = i >= 4; add(C[n](), back ? (i - 5) * 1.9 : (i - 1.5) * 1.75, back ? -2.2 : 0); });
    else if (k === 'hug') { add(C.rhea(), 0, -0.42, 0, 'hug'); add(C.pip(), 0, 0.42, Math.PI, 'hug'); }
    else if (k === 'citizens') for (let i = 0; i < 8; i++) add(C.citizen(i + 1), (i - 3.5) * 1.45, (i % 2) * 0.6);
    else if (k === 'tributes') for (let i = 1; i <= 8; i++) add(C.tribute(i, i), (i - 4.5) * 1.45, 0, i % 2 ? 0 : Math.PI);
    else if (k === 'crowd') { const spots = []; for (let r = 0; r < 6; r++) for (let c = 0; c < 10; c++) spots.push([(c - 4.5) * 1.15 + (r % 2) * 0.5, -r * 1.25, 0]); crowd = RT.characters.crowd({ spots, seed: 4 }); stage.add(crowd); }
    else add(C[k](), 0);
    frameCamera();
  }
  // ---------- camera (simple touch/mouse orbit, no add-ons) ----------
  const orbit = { yaw: 0, pitch: 0.1, dist: 6, target: new THREE.Vector3(0, 1.2, 0) };
  function frameCamera() {
    const wide = state.char === 'lineup' || state.char === 'citizens' || state.char === 'tributes' || state.char === 'crowd';
    const headY = state.char === 'vire' ? 2.42 : state.char === 'pip' ? 1.68 : state.char === 'dax' ? 2.27 : 2.14;   // face height (world units)
    if (state.view === 'face' && !wide) { orbit.target.set(0, headY, 0); orbit.dist = 2.0; orbit.pitch = 0.02; }
    else if (state.view === 'low' && !wide) { orbit.target.set(0, 1.75, 0); orbit.dist = 3.6; orbit.pitch = -0.38; }
    else { orbit.target.set(0, wide ? 1.1 : 1.2, state.char === 'crowd' ? -3 : 0); orbit.dist = wide ? (state.char === 'crowd' ? 13 : state.char === 'lineup' ? 17 : 12) : 5.2; orbit.pitch = 0.1; }
    orbit.yaw = state.yaw;
  }
  function placeCamera() {
    const { yaw, pitch, dist, target } = orbit;
    camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(target);
  }
  const ptrs = new Map(); let pinch0 = 0, dist0 = 0, lastTap = 0;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = orbit.dist; }
    const now = performance.now(); if (ptrs.size === 1 && now - lastTap < 300) { state.view = vSel.value = 'face'; frameCamera(); } lastTap = now; });
  cv.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return; const p = ptrs.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1) { orbit.yaw -= dx * 0.008; orbit.pitch = RT.clamp(orbit.pitch + dy * 0.006, -0.6, 1.3); }
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; orbit.dist = RT.clamp(dist0 * pinch0 / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1])), 0.8, 40); }
  });
  const up = (e) => ptrs.delete(e.pointerId); cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', (e) => { e.preventDefault(); orbit.dist = RT.clamp(orbit.dist * (1 + e.deltaY * 0.001), 0.8, 40); }, { passive: false });

  // ---------- UI ----------
  cSel.onchange = () => { state.char = cSel.value; build(); };
  mSel.onchange = () => { state.move = mSel.value; t0 = performance.now(); };
  fSel.onchange = () => { state.face = fSel.value; };
  moodSel.onchange = () => { state.mood = moodSel.value; env.set(state.mood); };
  vSel.onchange = () => { state.view = vSel.value; frameCamera(); };
  const spinBtn = document.getElementById('spin'); spinBtn.onclick = () => { state.spin = !state.spin; spinBtn.classList.toggle('on', state.spin); };
  document.getElementById('toggle').onclick = (e) => { const p = document.getElementById('panel'); p.classList.toggle('min'); e.target.textContent = p.classList.contains('min') ? 'Show' : 'Hide'; };

  function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  // ---------- one frame at time t (pure function of t) ----------
  const ONE_SHOT = { jump: 1.4, fallOver: 2.2 };      // these loop with a pause
  function renderAt(t) {
    for (const a of actors) {
      const move = a.move || state.move, lt = ONE_SHOT[move] ? t % ONE_SHOT[move] : t;
      RT.anim.set(a.ch, move, lt);
      if (state.face !== 'auto') a.ch.rig.setFace(state.face);
      else if (!RT.anim.pose(move, lt).face) a.ch.rig.setFace(a.def);
      a.ch.rig.update(t);
    }
    if (crowd) crowd.update(t, { cheer: state.move === 'cheer' ? 1 : 0 });
    if (state.spin) orbit.yaw += 0.006;
    placeCamera(); env.follow(camera); env.shadowFocus(orbit.target.x, 0, orbit.target.z, state.char === 'crowd' ? 14 : 9);
    renderer.render(scene, camera);
  }
  window.renderAt = renderAt;
  window.viewer = { state, build, frameCamera, env, orbit, renderAt, setState(o) { Object.assign(state, o); if (o.mood) env.set(o.mood); if (o.char) build(); else frameCamera(); } };

  env.set(state.mood);
  build();
  let t0 = performance.now();
  if (STATIC) { renderAt(state.t); window.viewerReady = true; }
  else (function loop() { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();   // live preview: wall clock is fine here
})();
</script>
</body>
</html>
